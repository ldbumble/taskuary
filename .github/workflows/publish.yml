# Publish to PyPI on a version tag. Trusted Publishing, so there is no API token anywhere -
# not in a secret, not in a clipboard, not in this file. PyPI verifies the workflow identity
# itself; configure it once at pypi.org/manage/account/publishing (see RELEASING.md).
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # a dry run to TestPyPI without cutting a tag

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }

      # The UI is committed, but a release must never ship a stale bundle: build it from the
      # source in THIS tag rather than trusting whatever was last committed.
      - name: Build the web UI
        run: npm ci && npm run build
        working-directory: website

      - name: Build sdist and wheel
        run: pipx run build

      # The wheel is the product: a package whose UI is missing installs fine and then serves
      # a blank page, which is a far worse first impression than no package at all.
      - name: Check the artifacts carry the app
        run: |
          pipx run twine check dist/*
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          need = {'index.html': any(n.endswith('web/index.html') for n in names),
                  'js bundle': any('/web/assets/' in n and n.endswith('.js') for n in names),
                  'css bundle': any('/web/assets/' in n and n.endswith('.css') for n in names),
                  'operator templates': sum(n.startswith('taskuary/templates/') for n in names) >= 5,
                  'whatsapp bridge': any(n.endswith('whatsapp/bridge.mjs') for n in names)}
          for k, ok in need.items(): print(f"{'OK  ' if ok else 'MISS'} {k}")
          sys.exit(0 if all(need.values()) else 1)
          PY

      - name: Install the wheel in a clean venv and start it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/python -c "import taskuary.server; print('imports clean')"
          /tmp/v/bin/taskuary --help

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dist, path: dist/ }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions: { id-token: write }        # this is what Trusted Publishing signs with
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  exe:
    # the one-file Windows build, so taskuary.com's Download button has a stable target:
    # github.com/ldbumble/taskuary/releases/latest/download/Taskuary.exe
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: pip install -e .[mssql,desktop,build,bundle]
      - run: pyinstaller taskuary.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: exe, path: dist/Taskuary.exe }

  ghcr:
    # The image nobody has to build themselves: ghcr.io/ldbumble/taskuary:<version>.
    # No secret is created or stored - GITHUB_TOKEN with packages:write is the whole
    # credential, the same trade Trusted Publishing makes for PyPI above.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45     # the arm64 leg runs pip under QEMU; never burn a runner for hours
    # push only. workflow_dispatch can be aimed at a tag ref, and re-publishing an already
    # released image tag should be a deliberate act, not the side effect of a TestPyPI dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write       # push to GHCR as the workflow, not as a stored password
      id-token: write       # short-lived Sigstore identity, as the release job uses
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }

      # The Dockerfile COPYs taskuary/web, which is the bundle as COMMITTED. Rebuild it
      # from this tag's source for the same reason the wheel does: the image and the
      # wheel have to be the same app, not whatever was last committed to master.
      - name: Build the web UI
        run: npm ci && npm run build
        working-directory: website

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Taken from the tag, never parsed. Taskuary versions have four components
      # (v0.3.4.12), so metadata-action's type=semver matches nothing and would publish
      # the image under no version tag at all, silently. type=raw cannot do that.
      - name: The version is the tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false          # latest is set below, deliberately, not inferred
          tags: |
            type=raw,value=${{ steps.version.outputs.number }}
            type=raw,value=latest

      # arm64 as well as amd64: a home server is as likely to be a Pi as a NUC, and no
      # runtime dependency needs compiling (pyodbc is an extra, not a base dependency).
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same provenance the wheel and the exe get, pushed beside the image so
      # `gh attestation verify oci://ghcr.io/ldbumble/taskuary:<version>` answers.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [pypi, exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release and attach artifacts.
      id-token: write # Short-lived Sigstore signing identity; no signing key secret.
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: exe, path: dist }
      - name: Attest the release artifacts
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
          create-storage-record: false
      - name: Include the signed verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.sigstore.json
      # The Changelog link in the README points at /releases. A bare tag there is not a
      # changelog - and the sdist/wheel attached give anyone auditing the release something
      # to compare against what PyPI is serving.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
