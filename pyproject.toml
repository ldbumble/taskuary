[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskuary"
version = "0.3.2.11"
description = "Automate your job - the local-first operating system for your work: AI triage in, coding agents out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "agents", "automation", "claude", "coding-agent", "email", "local-first", "task-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2",
    "requests>=2.28",
    "loguru>=0.7",
    "segno>=1.6",               # WhatsApp pairing QR drawn ON the card - pure Python, no Pillow
    "anthropic>=0.69",
    "tomli>=2; python_version<'3.11'",
    "websockets>=12",                            # uvicorn's ws transport - the terminal streams over it
    "pywinpty>=2; sys_platform=='win32'",        # ConPTY: the interactive agent terminal
    "pyte>=0.8",                                 # a real VT emulator: how a session transcript is read
]

[project.optional-dependencies]
mssql = ["pyodbc>=4"]
db = ["sqlalchemy>=2"]      # 'any database' URLs; add the engine driver too (psycopg2-binary, pymysql, ...)
aws = ["boto3>=1.28"]       # azure needs no extra: tokens ride plain requests
voice = ["faster-whisper>=1.0"]   # Local Whisper: speech to text on this machine, no key, audio never leaves the box
desktop = ["pywebview>=4"]
build = ["pyinstaller>=6"]
dev = ["pytest>=7", "httpx>=0.24", "openpyxl>=3"]   # openpyxl READS xlsx in tests; the writer is ours

[project.urls]
Homepage = "https://github.com/ldbumble/taskuary"
Repository = "https://github.com/ldbumble/taskuary"
Issues = "https://github.com/ldbumble/taskuary/issues"
Changelog = "https://github.com/ldbumble/taskuary/releases"

[project.scripts]
taskuary = "taskuary.cli:main"
taskuary-desktop = "taskuary.desktop:main"

[tool.setuptools.packages.find]
include = ["taskuary*"]

# templates/ ships too: the operator documents (SOUL.md / CODER.md / DIGEST.md) seed the
# database on first run, so a wheel without them starts every install with empty docs.
[tool.setuptools.package-data]
# whatsapp/ too: the bridge error tells you to run `node bridge.mjs` out of the package, and
# a pip install without it is an instruction pointing at a directory that does not exist.
taskuary = ["web/*", "web/assets/*", "templates/*.md", "whatsapp/*"]
