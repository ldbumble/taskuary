name: ci
on:
  push: { branches: [master, main] }
  pull_request: { branches: [master, main] }

# Fork PRs get a read-only token. First-time outside collaborators still need a
# maintainer to click "Approve and run workflows" (repo Actions setting) - the
# trigger is not missing; GitHub holds the run at action_required until then.
permissions: { contents: read }

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .[dev]
      - run: pip install pyodbc
        if: runner.os == 'Windows'
      - run: pytest -q

  build-web:
    # the built UI is committed into taskuary/web; this proves the source still builds,
    # and the node:test suite covers the view logic that has no Python behind it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website

  build-exe:
    # push only: a fork PR must not mint the one-file exe (untrusted code + upload)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e .[mssql,desktop,build]
      - run: pyinstaller taskuary.spec
      - uses: actions/upload-artifact@v4
        with: { name: Taskuary-windows-exe, path: dist/Taskuary.exe }
