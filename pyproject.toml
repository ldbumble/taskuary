[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskhub"
version = "0.1.0"
description = "Automate Your Work - task-driven agent work over your existing systems, fully local."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2",
    "requests>=2.28",
    "loguru>=0.7",
]

[project.optional-dependencies]
mssql = ["sqlalchemy>=1.4", "pyodbc>=4"]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
taskhub = "taskhub.cli:main"

[tool.setuptools.packages.find]
include = ["taskhub*"]

[tool.setuptools.package-data]
taskhub = ["web/*"]
