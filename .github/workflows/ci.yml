name: ci
on:
  push: { branches: [master, main] }
  pull_request: { branches: [master, main] }
  workflow_dispatch: # Run required checks on a bot-created chart PR.

# Fork PRs get a read-only token. First-time outside collaborators still need a
# maintainer to click "Approve and run workflows" (repo Actions setting) - the
# trigger is not missing; GitHub holds the run at action_required until then.
permissions: { contents: read }

jobs:
  ci-required:
    name: ci-required
    if: always()
    # ...the layout-pinning browser parts and the walk REPORT and no longer block (the owner, 2026-10-29: "I need to iterate quicker");
    # what blocks a release is the smoke set - the app loads and the agent buttons work end to end
    needs: [test, build-web, smoke, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required CI jobs did not pass: {failed}')
          print('All required CI jobs passed')
          PY

  test:
    strategy:
      fail-fast: false
      matrix:
        # the newest Python on every OS, and the oldest supported one on Linux: six runners were twice the random
        # failures for little more coverage (2026-10-20)
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.12"]
        include: [{ os: ubuntu-24.04, python: "3.10" }]
    runs-on: ${{ matrix.os }}
    # a hung test fails the job in minutes, with its logs, instead of holding a runner for six hours (2026-10-16)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .[dev]
      - run: pip install pyodbc
        if: runner.os == 'Windows'
      # a test past two minutes prints every thread's stack - the hang names itself in the log
      - run: pytest -q -o faulthandler_timeout=120
      - name: Desk and load CLI
        env:
          TASKUARY_HOME: ${{ runner.temp }}/taskuary-reg
        run: |
          python -m taskuary.testing desk
          python -m taskuary.testing load 32 --force

  build-web:
    # the built UI is committed into taskuary/web; this proves the source still builds,
    # and the node:test suite covers the view logic that has no Python behind it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm run build:docs
        working-directory: website
      # the docs site is committed the same way the packaged UI is, for the same reason: nobody
      # hand-edits the HTML, and a source change that was never rebuilt fails here rather than
      # shipping a page that disagrees with docs/site/
      - name: Verify committed docs site matches source
        # strict on a release commit (tools/release.sh rebuilds the docs into it); an ordinary push between releases may carry a
        # docs page whose site copy the next release builds - red on every such push turned the README badge red (2026-10-28)
        if: startsWith(github.event.head_commit.message, 'Release ') || github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code -- site/docs
          added=$(git ls-files --others --exclude-standard -- site/docs)
          if [ -n "$added" ]; then
            echo "Build produced uncommitted docs pages:"
            echo "$added"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: docs-as-ci-built-it, path: site/docs, retention-days: 3 }
      - name: Verify committed packaged UI matches source
        shell: bash
        run: |
          git diff --exit-code -- taskuary/web
          added=$(git ls-files --others --exclude-standard -- taskuary/web)
          if [ -n "$added" ]; then
            echo "Build produced uncommitted packaged assets:"
            echo "$added"
            exit 1
          fi
      # When the check fails, the only way to learn WHY is to diff what CI built against what was
      # committed - and a `git diff` of deleted minified chunks in the log is truncated past use
      # (56f266a0, 2026-09-18: three hashes differed, the log showed one line of one of them).
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: web-as-ci-built-it, path: taskuary/web, retention-days: 3 }

  smoke:
    # THE BROWSER GATE (2026-10-29): a handful of files that prove the app loads and Send to agent / Continue / Run another work,
    # coding and general - the rest of the browser suite and the walk still run below and report, but a moved button no longer stops a release
    name: browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: pip install -e .[dev]
      - run: npm ci
        working-directory: website
      - run: node --test --test-concurrency=1 browser/loads-once.test.mjs browser/general-starting.test.mjs browser/continue-shows-turn.test.mjs browser/run-another-general.test.mjs
        working-directory: website

  browser:
    # Real Chromium + the disposable fixture backend; never targets the owner's server.
    # ...in three parts at once (2026-10-21): file after file on one machine it outgrew 10 minutes and was cut off mid-run.
    # browser/shard.mjs deals package.json's test:browser list out, so the list stays the one place a test is named.
    # ...in four (2026-10-27): the one-row dock's and the drawers' tests took part 1 past its 15 minutes, and it was cancelled mid-run.
    # ...and in six, with 20 minutes each (2026-10-27, later): a day's new browser tests took part 1 of four past its 15 again.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    name: browser (${{ matrix.part }} of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: pip install -e .[dev]
      - run: npm ci
        working-directory: website
      - run: node browser/shard.mjs ${{ matrix.part }} 6
        working-directory: website

  walk:
    # The dead-end walk on its own: it presses every button on the list and forces each failure (2026-10-18), which takes
    # longer than the rest of the browser suite together - inside the 10-minute browser job it was cancelled, not failed.
    # ...and in four parts at once (2026-10-20): one 15-minute walk held every run; its passes share nothing but the build
    strategy:
      fail-fast: false
      matrix:
        passes: ["walk", "sweep", "faults", "cards,links,based", "search,table,stopsave"]
    name: walk (${{ matrix.passes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: pip install -e .[dev]
      - run: npm ci
        working-directory: website
      - run: npm run test:walk
        working-directory: website
        env: { WALK_ONLY: "${{ matrix.passes }}" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "walk-pressed-${{ strategy.job-index }}", path: website/browser/walk-pressed-*.json, if-no-files-found: ignore }

  walk-cover:
    # COVER - every button on the list pressed at least once - needs every part's presses: checked here, over all four
    needs: walk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22" }
      - run: npm ci
        working-directory: website
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: walk-pressed-*, path: pressed, merge-multiple: true }
      - name: Every button pressed somewhere in the walk
        working-directory: website
        run: |
          out=$(node deadend_check.mjs --cover "$(ls ../pressed/*.json | paste -sd, -)" | tail -1)
          echo "$out"
          node -e 'const o=JSON.parse(process.argv[1]); if (o.found.length) { console.error(o.found.join(String.fromCharCode(10))); process.exit(1) }' "$out"


  docker:
    # proves the image builds, serves the UI, persists across restart, and the
    # token gate still works when TASKUARY_TOKEN is set. The regression desk is
    # seeded into the regression volume first so /api/feed is a real Timeline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose build
      - name: Smoke the container
        run: |
          set -euo pipefail
          docker compose --profile regression run --rm desk
          TASKUARY_TOKEN=regression-secret docker compose --profile regression up -d taskuary-reg
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7787/api/health | grep -q '"ok": *true'; then break; fi
            if [ "$i" -eq 40 ]; then docker compose --profile regression logs; exit 1; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:7787/ | grep -q Taskuary
          js=$(curl -sf http://127.0.0.1:7787/ | sed -n 's/.*src="\/assets\/\([^"]*\)".*/\1/p' | head -1)
          test -n "$js"
          curl -sf "http://127.0.0.1:7787/assets/$js" -o /tmp/taskuary-asset.js
          test -s /tmp/taskuary-asset.js
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request('http://127.0.0.1:7787/api/feed',
                                       headers={'X-Taskuary-Token': 'regression-secret'})
          data = json.load(urllib.request.urlopen(req))['data']
          assert data, 'desk left the Timeline empty'
          assert any(r.get('ReviewStatus') == 'pending' for r in data), 'pending_draft missing from the feed'
          print(len(data), 'feed rows after desk')
          PY
          tid=$(curl -sf -X POST http://127.0.0.1:7787/api/tasks \
            -H 'X-Taskuary-Token: regression-secret' \
            -H 'content-type: application/json' -d '{"Title":"docker smoke"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['taskId'])")
          docker compose --profile regression restart taskuary-reg
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7787/api/health >/dev/null; then break; fi
            if [ "$i" -eq 40 ]; then docker compose --profile regression logs; exit 1; fi
            sleep 1
          done
          curl -sf -H 'X-Taskuary-Token: regression-secret' \
            http://127.0.0.1:7787/api/tasks | grep -q "$tid"
          test "$(docker compose --profile regression exec -T taskuary-reg id -u)" = 1000
          docker compose --profile regression down
          TASKUARY_TOKEN=s3cret docker compose up -d
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7787/api/health >/dev/null; then break; fi
            if [ "$i" -eq 40 ]; then docker compose logs; exit 1; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7787/api/settings)" = 401
          curl -sf -H 'X-Taskuary-Token: s3cret' http://127.0.0.1:7787/api/settings >/dev/null
          docker compose down

  build-exe:
    # push only: a fork PR must not mint the one-file exe (untrusted code + upload)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - run: pip install -e .[mssql,desktop,build,bundle]
      - run: pyinstaller taskuary.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: Taskuary-windows-exe, path: dist/Taskuary.exe }
