<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The six documents and who reads them: TRIAGE, STYLE, SOUL and LEARNED feed triage and replies; SOUL, CODER and LEARNED feed coding agents; DIGEST is the owner's morning brief. TRIAGE and STYLE can be generated from three months of the owner's own mail.</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>

  <!-- you write, or the Generate-from-history button does -->
  <rect x="16" y="16" width="180" height="144" rx="10" fill="none" stroke="#8b93a7" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30" y="34" font-size="9" letter-spacing="1" fill="#8b93a7">YOU WRITE — OR GENERATE</text>
  <text x="30" y="46" font-size="9" letter-spacing="1" fill="#8b93a7">FROM 3 MONTHS OF YOUR MAIL</text>
  <rect x="30" y="64" width="152" height="38" rx="7" fill="#eeedfc" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="106" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2130">TRIAGE.md</text>
  <rect x="30" y="112" width="152" height="38" rx="7" fill="#eeedfc" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="106" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2130">STYLE.md</text>

  <!-- you write -->
  <rect x="16" y="172" width="180" height="130" rx="10" fill="none" stroke="#8b93a7" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30" y="194" font-size="10" letter-spacing="1.5" fill="#8b93a7">YOU WRITE</text>
  <rect x="30" y="206" width="152" height="38" rx="7" fill="#eeedfc" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="106" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2130">SOUL.md</text>
  <rect x="30" y="254" width="152" height="38" rx="7" fill="#eeedfc" stroke="#4f46e5" stroke-width="1.3"/>
  <text x="106" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2130">CODER.md</text>

  <!-- write themselves -->
  <rect x="16" y="314" width="180" height="130" rx="10" fill="none" stroke="#8b93a7" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30" y="336" font-size="10" letter-spacing="1.5" fill="#8b93a7">WRITE THEMSELVES</text>
  <rect x="30" y="348" width="152" height="38" rx="7" fill="#eeedfc" stroke="#4f46e5" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="106" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2130">LEARNED.md</text>
  <rect x="30" y="396" width="152" height="38" rx="7" fill="#eeedfc" stroke="#4f46e5" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="106" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2130">DIGEST.md</text>

  <!-- consumers -->
  <rect x="452" y="98" width="192" height="60" rx="30" fill="#4f46e5"/>
  <text x="548" y="124" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">triage &amp; replies</text>
  <text x="548" y="142" text-anchor="middle" font-size="11" fill="#dcd9ff">the cheap model, every message</text>
  <rect x="452" y="238" width="192" height="60" rx="30" fill="#4f46e5"/>
  <text x="548" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">coding agents</text>
  <text x="548" y="282" text-anchor="middle" font-size="11" fill="#dcd9ff">your CLI, its full model</text>
  <rect x="452" y="385" width="192" height="60" rx="30" fill="#7c6cf0"/>
  <text x="548" y="411" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">you</text>
  <text x="548" y="429" text-anchor="middle" font-size="11" fill="#e4e1ff">the morning read</text>

  <!-- edges -->
  <path d="M182 83 C 320 83, 340 112, 448 116" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M182 131 C 320 131, 340 125, 448 124" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M182 216 C 330 200, 350 138, 448 132" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M182 234 C 320 238, 340 254, 448 256" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M182 273 C 320 273, 340 268, 448 264" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M182 358 C 340 330, 360 148, 448 140" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M182 376 C 320 368, 340 280, 448 272" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M182 415 C 320 415, 340 415, 448 415" fill="none" stroke="#8b93a7" stroke-width="1.4" marker-end="url(#b)"/>
</svg>
