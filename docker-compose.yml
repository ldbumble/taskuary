# Taskuary — docker compose up, then http://127.0.0.1:7787
#
# Data persists in the taskuary-data volume. Coding CLIs (Claude Code, Codex, …)
# and the WhatsApp bridge are host programs; they are not in this image.
# Publish past localhost only with TASKUARY_TOKEN set:
#   TASKUARY_TOKEN=... docker compose up
#
# Seed /data with the regression desk (the same pictures tests/test_factory.py pins):
#   docker compose --profile regression run --rm desk
services:
  taskuary:
    build: .
    image: taskuary:local
    init: true
    ports:
      - "127.0.0.1:7787:7787"
    volumes:
      - taskuary-data:/data
    environment:
      - TASKUARY_HOST=0.0.0.0
      # name-only: pass through from the host when set. `${TOKEN:-}` would inject ''
      # and that used to wipe a token stored on the volume.
      - TASKUARY_TOKEN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  desk:
    profiles: ["regression"]
    image: taskuary:local
    build: .
    user: "1000:1000"
    volumes:
      - taskuary-data:/data
    environment:
      TASKUARY_HOME: /data
    command: ["python", "-m", "taskuary.testing", "desk"]

volumes:
  taskuary-data:
