# The installs chart in the README, refreshed once a day from PyPI's own numbers.
#
# Mirror traffic is excluded (pypistats' own split): a full PyPI mirror pulls every release, so
# counting it would let three real users read as hundreds. CI installs are a different problem
# and the public API cannot separate them - the `installer` field that would live in BigQuery,
# not here - so the chart says "mirrors excluded" and claims nothing more. See tools/pypi_downloads.py.
name: downloads

on:
  schedule: [{ cron: '17 7 * * *' }]      # after PyPI's stats settle for the previous UTC day
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: downloads
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Update only the automation branch, never master.
      pull-requests: write # Propose chart changes for review.
      actions: write # GITHUB_TOKEN PRs need explicit dispatch to run required checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install pypistats

      # The CSV is the long memory: the API only keeps 180 days, and merging into a committed
      # history is what lets the series outlive that window.
      - run: python tools/pypi_downloads.py --package taskuary --history docs/downloads.csv --out docs/downloads.svg

      - name: Propose the chart update
        id: chart-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/downloads
          base: master
          add-paths: |
            docs/downloads.csv
            docs/downloads.svg
          commit-message: 'docs: update download counts'
          title: 'docs: update download counts'
          body: 'Refresh the PyPI download history and chart. Mirrors are excluded. Required CI must pass before merging.'
      - name: Run required checks for the chart PR
        if: steps.chart-pr.outputs.pull-request-operation == 'created' || steps.chart-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref automation/downloads
          gh workflow run codeql.yml --ref automation/downloads
