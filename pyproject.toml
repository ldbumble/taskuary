[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskuary"
version = "0.1.0"
description = "Automate your job - the local-first operating system for your work: AI triage in, coding agents out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2",
    "requests>=2.28",
    "loguru>=0.7",
    "anthropic>=0.69",
    "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
mssql = ["pyodbc>=4"]
desktop = ["pywebview>=4"]
build = ["pyinstaller>=6"]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
taskuary = "taskuary.cli:main"
taskuary-desktop = "taskuary.desktop:main"

[tool.setuptools.packages.find]
include = ["taskuary*"]

[tool.setuptools.package-data]
taskuary = ["web/*", "web/assets/*"]
