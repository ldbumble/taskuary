ht="normal" class="text-inner-tspan" font-style="normal"> agent</tspan></tspan></text></g></g></g><g transform="translate(365.3671875, 731)" class="edgeLabel"><g transform="translate(-33.1171875, -12.5)" class="label"><g><rect height="25" width="66.234375" y="-3" x="-2" style="" class="background"></rect><text style="" y="-10.1"><tspan dy="1.1em" y="-0.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">its</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> shape</tspan></tspan></text></g></g></g><g transform="translate(365.3671875, 907)" class="edgeLabel"><g transform="translate(-22.8046875, -12.5)" class="label"><g><rect height="25" width="45.609375" y="-3" x="-2" style="" class="background"></rect><text style="" y="-10.1"><tspan dy="1.1em" y="-0.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">its</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> life</tspan></tspan></text></g></g></g><g transform="translate(365.3671875, 1083)" class="edgeLabel"><g transform="translate(-29.3046875, -12.5)" class="label"><g><rect height="25" width="58.609375" y="-3" x="-2" style="" class="background"></rect><text style="" y="-10.1"><tspan dy="1.1em" y="-0.1em" x="0" class="text-outer-tspan"><tspan font-weight="normal" class="text-inner-tspan" font-style="normal">its</tspan><tspan font-weight="normal" class="text-inner-tspan" font-style="normal"> draft</tspan></tspan></text></g></g></g></g><g class="nodes"><g transform="translate(147, 637)" id="flowchart-Q-64" class="node default"><polygon transform="translate(-139,139)" class="label-container" points="139,0 278,-139 139,-278 0,-139"></polygon><g transform="translate(-100, -24)" style="" class="label"><rect></rect><foreignObject height="48" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>What do you ask about a task?</p></span></div></foreignObject></g></g><g transform="translate(574.734375, 83)" id="flowchart-C-66" class="node default"><rect height="150" width="260" y="-75" x="-130" style="" class="basic label-container"></rect><g transform="translate(-100, -60)" style="" class="label"><rect></rect><foreignObject height="120" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>priority · title · owner → task.update<br/>kind → task.set_kind<br/>repository → task.set_repo<br/>tick a box → task.check</p></span></div></foreignObject></g></g><g transform="translate(574.734375, 307)" id="flowchart-P-68" class="node default"><rect height="198" width="260" y="-99" x="-130" style="" class="basic label-container"></rect><g transform="translate(-100, -84)" style="" class="label"><rect></rect><foreignObject height="168" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>a note → task.comment<br/>hand to a person → task.handoff (draft for your yes)<br/>ask the sender → task.clarify (draft for your yes)</p></span></div></foreignObject></g></g><g transform="translate(574.734375, 543)" id="flowchart-A-70" class="node default"><rect height="174" width="260" y="-87" x="-130" style="" class="basic label-container"></rect><g transform="translate(-100, -72)" style="" class="label"><rect></rect><foreignObject height="144" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>start one → dispatch.prepare<br/>pick up its last session → agent.continue<br/>save and end → agent.stop<br/>answer it → agent.answer</p></span></div></foreignObject></g></g><g transform="translate(574.734375, 731)" id="flowchart-S-72" class="node default"><rect height="102" width="250.609375" y="-51" x="-125.3046875" style="" class="basic label-container"></rect><g transform="translate(-95.3046875, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="190.609375"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>two jobs → task.split<br/>a duplicate → task.merge<br/>not work → task.not_a_task</p></span></div></foreignObject></g></g><g transform="translate(574.734375, 907)" id="flowchart-L-74" class="node default"><rect height="150" width="260" y="-75" x="-130" style="" class="basic label-container"></rect><g transform="translate(-100, -60)" style="" class="label"><rect></rect><foreignObject height="120" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>finished → task.complete (Mark done)<br/>back again → task.reopen<br/>not now → task.defer (Remind me)</p></span></div></foreignObject></g></g><g transform="translate(574.734375, 1083)" id="flowchart-D-76" class="node default"><rect height="102" width="223" y="-51" x="-111.5" style="" class="basic label-container"></rect><g transform="translate(-81.5, -36)" style="" class="label"><rect></rect><foreignObject height="72" width="163"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>send → review.approve<br/>reject → review.reject<br/>rewrite → redraft</p></span></div></foreignObject></g></g></g></g></g></svg>
