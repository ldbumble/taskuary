<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Taskuary · demo traffic</title>
<!-- Not linked from anywhere. Analytics require the signed HttpOnly session issued by the admin
     login, so this static page contains no credential and has no data of its own. -->
<style>
  :root{--bg:#f6f4ef;--panel:#fffdfb;--bd:#e7e3da;--ink:#1f2a22;--dim:#6b7a6e;--faint:#98a396;--accent:#4f46e5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial}
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
  input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--panel);color:var(--ink)}
  button{cursor:pointer;font-weight:600}
  button.primary{background:var(--ink);border-color:var(--ink);color:white}
  button.quiet{background:transparent;color:var(--dim)}
  .login{max-width:390px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:18px;margin:26px 0}
  .login h2{margin:0 0 4px;color:var(--ink);font-size:15px;letter-spacing:0;text-transform:none}
  .login p{margin:0 0 14px;color:var(--dim);font-size:12.5px}
  .login label{display:block;color:var(--dim);font-size:11.5px;font-weight:600;margin:9px 0 4px}
  .login input{display:block;width:100%}
  .login button{margin-top:14px;min-width:82px}
  .login .msg{padding:10px 0 0;color:#9c3f4f}
  .hidden{display:none!important}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
  .card b{display:block;font-size:24px;line-height:1.2}
  .card span{color:var(--dim);font-size:12px}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:26px 0 8px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:7px 12px;border-top:1px solid var(--bd);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;border-top:none}
  td:last-child,th:last-child{text-align:right}
  .bar{height:6px;background:var(--accent);border-radius:99px;opacity:.85;display:inline-block;vertical-align:middle;margin-right:6px}
  .msg{color:var(--dim);padding:14px 0}
  svg{background:var(--panel);border:1px solid var(--bd);border-radius:10px;width:100%;height:auto}
</style>
</head><body><div class="wrap">
<h1>Demo traffic</h1>
<div class="sub">Who opened taskuary.com and the demo, and what they did once they were in it.
  Nobody here is a person: the id lives in one browser tab and dies with it.</div>
<div id="login" class="login hidden">
  <h2>Admin sign in</h2>
  <p>Use the Taskuary stats administrator account.</p>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="signIn" class="primary" type="submit">Sign in</button>
    <div id="loginMsg" class="msg" aria-live="polite"></div>
  </form>
</div>
<div id="controls" class="row hidden">
  <select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select>
  <button id="go" class="primary">Refresh</button>
  <button id="logout" class="quiet">Sign out</button>
</div>
<div id="out"><div class="msg">Checking your session…</div></div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, function(c){
  return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; }); }

// sessions per day is one measure over time, so it is a line - the same shape the app's own
// report charts draw for a dated series (taskuary/artifacts.py)
function line(rows){
  if (rows.length < 2) return '';
  var W = 860, H = 220, L = 44, R = 16, T = 18, B = 26;
  var peak = Math.max.apply(null, rows.map(function(r){ return r.sessions; })) || 1;
  var step = Math.pow(10, Math.floor(Math.log10(peak / 3 || 1)));
  [1, 2, 2.5, 5, 10].some(function(m){ if (step * m * 3 >= peak) { step *= m; return true; } return false; });
  var ticks = [];
  for (var t = 0; t <= peak; t += step) ticks.push(Math.round(t * 100) / 100);
  var top = ticks[ticks.length - 1] || 1;
  var px = function(i){ return L + (W - L - R) * (i / Math.max(1, rows.length - 1)); };
  var py = function(v){ return H - B - (H - T - B) * (v / top); };
  var pts = rows.map(function(r, i){ return px(i).toFixed(1) + ',' + py(r.sessions).toFixed(1); }).join(' ');
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  ticks.forEach(function(t){
    var y = py(t).toFixed(1);
    s += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#e7e3da"/>'
       + '<text x="' + (L - 8) + '" y="' + (py(t) + 4).toFixed(1) + '" font-size="10" fill="#98a396" text-anchor="end">' + t + '</text>';
  });
  s += '<polygon points="' + L + ',' + (H - B) + ' ' + pts + ' ' + (W - R) + ',' + (H - B) + '" fill="#4f46e5" fill-opacity="0.08"/>';
  s += '<polyline points="' + pts + '" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>';
  var every = Math.max(1, Math.floor(rows.length / 7));
  rows.forEach(function(r, i){
    if (i % every && i !== rows.length - 1) return;
    s += '<text x="' + px(i).toFixed(1) + '" y="' + (H - B + 16) + '" font-size="10" fill="#98a396" text-anchor="middle">' + esc(r.d.slice(5)) + '</text>';
  });
  return s + '</svg>';
}

function table(head, rows, max){
  var h = '<table><tr>' + head.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
  rows.forEach(function(r){
    h += '<tr>' + r.map(function(c, i){
      if (i === r.length - 1 && max) return '<td><span class="bar" style="width:' + Math.round(60 * c / max) + 'px"></span>' + esc(c) + '</td>';
      return '<td>' + esc(c) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</table>';
}

function showLogin(message){
  $('login').classList.remove('hidden');
  $('controls').classList.add('hidden');
  $('out').innerHTML = '';
  $('loginMsg').textContent = message || '';
  setTimeout(function(){ $('username').focus(); }, 0);
}

function showStats(){
  $('login').classList.add('hidden');
  $('controls').classList.remove('hidden');
  $('loginMsg').textContent = '';
}

function loadStats(){
  var days = $('days').value;
  $('out').innerHTML = '<div class="msg">Reading…</div>';
  fetch('/api/ev?days=' + days).then(function(r){
    if (r.status === 401) { showLogin('Your session expired. Sign in again.'); throw new Error('signed out'); }
    if (!r.ok) throw new Error('Could not read analytics (HTTP ' + r.status + ').');
    return r.json();
  }).then(function(d){
    if (d.note) { $('out').innerHTML = '<div class="msg">' + esc(d.note) + ' — see site/README.md for the two wrangler commands.</div>'; return; }
    var visits = d.visits || [];
    var sessions = visits.reduce(function(a, b){ return a + b.sessions; }, 0);
    var events = visits.reduce(function(a, b){ return a + b.events; }, 0);
    var kinds = {};
    (d.kinds || []).forEach(function(k){ kinds[k.Kind] = k.n; });
    var stayed = (d.depth || []).filter(function(x){ return x.bucket !== '1 (bounced)'; })
                                .reduce(function(a, b){ return a + b.sessions; }, 0);
    var html = '<div class="cards">'
      + '<div class="card"><b>' + sessions + '</b><span>sessions</span></div>'
      + '<div class="card"><b>' + events + '</b><span>things done</span></div>'
      + '<div class="card"><b>' + (kinds.cta || 0) + '</b><span>pressed a button on the landing page</span></div>'
      + '<div class="card"><b>' + stayed + '</b><span>did more than arrive</span></div></div>';
    html += '<h2>Sessions per day</h2>' + (line(visits) || '<div class="msg">Not enough days yet.</div>');
    var dmax = Math.max.apply(null, (d.depth || []).map(function(x){ return x.sessions; }).concat([1]));
    html += '<h2>How far they got</h2>' + table(['events in the session', 'sessions'],
      (d.depth || []).map(function(x){ return [x.bucket, x.sessions]; }), dmax);
    var kmax = Math.max.apply(null, (d.kinds || []).map(function(x){ return x.n; }).concat([1]));
    html += '<h2>What they did</h2>' + table(['event', 'count'],
      (d.kinds || []).map(function(x){ return [x.Kind, x.n]; }), kmax);
    var wmax = Math.max.apply(null, (d.what || []).map(function(x){ return x.n; }).concat([1]));
    html += '<h2>Which ones</h2>' + table(['event', 'what', 'count'],
      (d.what || []).map(function(x){ return [x.Kind, x.What, x.n]; }), wmax);
    $('out').innerHTML = html;
  }).catch(function(e){
    if (e.message !== 'signed out') $('out').innerHTML = '<div class="msg">' + esc(e.message) + '</div>';
  });
}

$('go').onclick = loadStats;
$('loginForm').onsubmit = function(event){
  event.preventDefault();
  var button = $('signIn');
  button.disabled = true;
  button.textContent = 'Signing in…';
  $('loginMsg').textContent = '';
  fetch('/api/stats-auth', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: $('username').value.trim(), password: $('password').value})
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(body){
      if (!r.ok) {
        var fallback = r.status === 404
          ? 'The stats login service is not deployed yet. Check that the latest taskuary Workers Build finished.'
          : 'Could not sign in (HTTP ' + r.status + ').';
        throw new Error(body.error || fallback);
      }
      return body;
    });
  }).then(function(){
    $('password').value = '';
    showStats();
    loadStats();
  }).catch(function(e){ $('loginMsg').textContent = e.message; })
    .finally(function(){ button.disabled = false; button.textContent = 'Sign in'; });
};
$('logout').onclick = function(){
  fetch('/api/stats-auth', {method: 'DELETE'}).finally(function(){
    $('password').value = '';
    showLogin('You are signed out.');
  });
};

fetch('/api/stats-auth').then(function(r){
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}).then(function(session){
  if (!session.authenticated) { showLogin(''); return; }
  showStats();
  loadStats();
}).catch(function(){ showLogin('The stats login is temporarily unavailable.'); });
</script>
</body></html>
