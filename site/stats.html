<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Taskuary · site stats</title>
<!-- A DASHBOARD IN PLAIN WORDS (the owner, 2026-10-15: "make it more like a dashboard and easy to understand. I have no idea
     what any of the data means right now"). The numbers are the same anonymous tab sessions /api/ev has always counted
     (functions/api/ev.js); what changed is that each one is named for what it means - visitors, downloads, who tried the
     demo, how long they stayed - instead of the collector's own words (row, verdict, dwell, "5-14 events"). Downloads lead
     in one dark band, because that is the number the page exists for. Not linked from the site; open to read. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Beacon, the site's own palette (site/index.html) */
  :root{--bg:#f6f4f1;--panel:#fffdfb;--panel2:#e9e3d8;--bd:#e1dcd5;--ink:#262521;--dim:#4d4a43;--faint:#6e685f;
        --accent:#55697a;--accent-ink:#41525f;--deep:#2c3a45;--sage:#6f8a6e;--sage-ink:#4c6450;--alert:#8a3646;--gold:#d4a72c;
        --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 70px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  header img{width:30px;height:30px;border-radius:8px}
  header h1{font-size:20px;margin:0;letter-spacing:-.01em}
  header .sub{color:var(--faint);font-size:13px}
  .range{margin-left:auto;display:flex;background:var(--panel2);border-radius:99px;padding:3px}
  .range button{font:600 13px var(--sans);border:0;background:transparent;color:var(--dim);padding:6px 14px;border-radius:99px;cursor:pointer}
  .range button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* THE BAND: downloads, the one number in colour */
  .band{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:28px;align-items:end;color:#fff;border-radius:18px;padding:24px 26px 20px;
        background:radial-gradient(120% 140% at 0% 0%,#4a5e6e 0%,var(--deep) 60%,#222d36 100%);box-shadow:0 10px 30px -18px rgba(30,40,50,.6)}
  .band .label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .band .n{font-size:68px;font-weight:700;letter-spacing:-.035em;line-height:1;margin:8px 0 10px}
  .band .hint{font-size:13.5px;opacity:.8}
  .band .hint b{color:#fff;opacity:1}
  .band .chip{display:inline-block;margin-top:12px;font:600 12.5px var(--sans);padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
  .band svg text{fill:rgba(255,255,255,.6)}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .kpi{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;min-width:0}
  .kpi .label{color:var(--dim);font-size:13px;font-weight:600}
  .kpi .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
  .kpi .hint{color:var(--faint);font-size:12.5px;margin-top:2px}
  .kpi .viz{flex:none;width:96px}
  .ring{width:64px;height:64px;margin-left:auto}
  .ring text{font:600 15px var(--sans);fill:var(--ink)}
  .up{color:var(--sage-ink);font-weight:600}.down{color:var(--alert);font-weight:600}

  /* how visitors came in: one bar, three doors */
  .doors{margin-top:12px}
  .split{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--panel2);margin:6px 0 12px}
  .split span{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:13.5px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:0}
  .legend b{font-family:var(--mono);font-size:13px;margin-right:4px}

  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;min-width:0}
  .card h2{font-size:14px;margin:0 0 2px}
  .card .what{color:var(--faint);font-size:12.5px;margin:0 0 12px}
  svg{display:block;width:100%;height:auto}
  svg .pt{opacity:0;transition:opacity .12s}svg .pt:hover{opacity:1}
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 96px;align-items:center;gap:10px;font-size:13.5px}
  .bar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:99px;transform-origin:left;animation:grow .6s cubic-bezier(.2,.7,.2,1)}
  .bar .val{text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap}
  .next .fill{background:var(--sage)}
  .next .bar.end .fill{background:var(--accent)}
  .next .bar.end .name{font-weight:600}
  @keyframes grow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){ .bar .fill{animation:none} }
  .msg{color:var(--faint);padding:30px 0;text-align:center}
  details{margin-top:12px}
  summary{cursor:pointer;color:var(--faint);font-size:13px}
  .foot{color:var(--faint);font-size:12.5px;margin-top:18px;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  td,th{padding:5px 8px;border-top:1px solid var(--bd);text-align:left}td:last-child,th:last-child{text-align:right}
  @media (max-width:820px){ .kpis{grid-template-columns:1fr} .grid,.grid2,.band{grid-template-columns:1fr} .range{margin-left:0} .band .n{font-size:56px} }
</style>
</head><body><div class="wrap">
<header>
  <img src="/icon.png" alt="">
  <div><h1>taskuary.com</h1><div class="sub">Who came, what they did, and who downloaded</div></div>
  <div class="range" role="tablist" aria-label="Period">
    <button data-days="7">7 days</button><button data-days="30" class="on">30 days</button><button data-days="90">90 days</button>
  </div>
</header>
<div id="out"><div class="msg">Reading…</div></div>
<div class="foot">Every number counts browser tabs, not people: no names, no cookies, no account. A tab that opens the site and then
  the demo is one visitor. Before 15 Oct 2026 the landing page counted each visit twice, so older numbers run high.</div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(n){ return (n || 0).toLocaleString(); }
function pct(a, b){ return b ? Math.round(100 * a / b) + '%' : '–'; }
function sum(rows, f){ return (rows || []).reduce(function(a, r){ return a + (f(r) || 0); }, 0); }
function what(d, kind, name){ return sum((d.what || []).filter(function(x){ return x.Kind === kind && (name == null || x.What === name); }), function(x){ return x.n; }); }
function day(s){ var d = new Date(s + 'T00:00:00'); return isNaN(d) ? s.slice(5) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }

// the collector's words, in the owner's
var TABS = { Board: 'Board', Tasks: 'Tasks', Connections: 'Connections', Hub: 'Hub', Review: 'Review', Reports: 'Reports',
             Assistant: 'Assistant', Settings: 'Settings', Docs: 'Docs', Timeline: 'Timeline' };
function source(src){
  var s = String(src || '').toLowerCase();
  if (!s || s.indexOf('direct') > -1) return 'Direct or bookmark';
  if (/google/.test(s)) return 'Google';
  if (/reddit/.test(s)) return 'Reddit';
  if (/github/.test(s)) return 'GitHub';
  if (/bing|duckduckgo|brave|yahoo|ecosia|kagi/.test(s)) return 'Other search engines';
  if (/t\.co|twitter|x\.com/.test(s)) return 'X (Twitter)';
  if (/linkedin|lnkd/.test(s)) return 'LinkedIn';
  if (/teams|microsoft|outlook|office/.test(s)) return 'Microsoft Teams / Outlook link';
  if (/taskuary\.com/.test(s)) return 'From taskuary.com itself';
  if (/news\.ycombinator|hacker/.test(s)) return 'Hacker News';
  return s.replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/^android-app:\/\//, '');
}
var countryName = (function(){ try { var d = new Intl.DisplayNames(['en'], { type: 'region' }); return function(c){ try { return d.of(c) || c; } catch(e){ return c; } }; } catch(e){ return function(c){ return c; }; } })();

function bars(rows, cls){
  var max = Math.max.apply(null, rows.map(function(r){ return r[1]; }).concat([1]));
  return '<div class="bars ' + (cls || '') + '">' + rows.map(function(r){
    return '<div class="bar' + (r[3] ? ' ' + r[3] : '') + '"><span class="name" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span>'
      + '<span class="track"><span class="fill" style="display:block;width:' + Math.max(2, Math.round(100 * r[1] / max)) + '%"></span></span>'
      + '<span class="val">' + esc(r[2] != null ? r[2] : fmt(r[1])) + '</span></div>';
  }).join('') + '</div>';
}
function group(rows, keyOf, valOf){
  var m = {}; (rows || []).forEach(function(r){ var k = keyOf(r); m[k] = (m[k] || 0) + valOf(r); });
  return Object.keys(m).map(function(k){ return [k, m[k]]; }).sort(function(a, b){ return b[1] - a[1]; });
}
function niceTop(peak){
  var step = Math.pow(10, Math.floor(Math.log10(peak / 3 || 1)));
  [1, 2, 2.5, 5, 10].some(function(m){ if (step * m * 3 >= peak) { step *= m; return true; } return false; });
  return [Math.ceil(peak / step) * step || 1, step];
}

// visitors per day: one line; hover a day for its count
function chart(rows){
  if (rows.length < 2) return '<div class="msg">Not enough days yet.</div>';
  var W = 640, H = 210, L = 34, R = 26, T = 12, B = 24;
  var ts = niceTop(Math.max.apply(null, rows.map(function(r){ return r.sessions; })) || 1), top = ts[0], step = ts[1];
  var px = function(i){ return L + (W - L - R) * (i / (rows.length - 1)); }, py = function(v){ return H - B - (H - T - B) * (v / top); };
  var pts = rows.map(function(r, i){ return px(i).toFixed(1) + ',' + py(r.sessions).toFixed(1); }).join(' ');
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Visitors per day"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0" stop-color="#55697a" stop-opacity=".28"/><stop offset="1" stop-color="#55697a" stop-opacity="0"/></linearGradient></defs>';
  for (var t = 0; t <= top; t += step) {
    var y = py(t).toFixed(1);
    s += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#ece7df"/>'
       + '<text x="' + (L - 6) + '" y="' + (+y + 3.5) + '" font-size="10" fill="#6e685f" text-anchor="end" font-family="IBM Plex Mono">' + t + '</text>';
  }
  s += '<polygon points="' + L + ',' + (H - B) + ' ' + pts + ' ' + (W - R) + ',' + (H - B) + '" fill="url(#area)"/>'
     + '<polyline points="' + pts + '" fill="none" stroke="#55697a" stroke-width="2.2" stroke-linejoin="round"/>';
  var every = Math.max(1, Math.ceil(rows.length / 7)), last = rows[rows.length - 1];
  rows.forEach(function(r, i){
    s += '<circle class="pt" cx="' + px(i).toFixed(1) + '" cy="' + py(r.sessions).toFixed(1) + '" r="9" fill="#55697a" fill-opacity=".18" stroke="#55697a" stroke-width="2">'
       + '<title>' + esc(day(r.d)) + ': ' + fmt(r.sessions) + ' visitors' + (r.downloads ? ', ' + fmt(r.downloads) + ' downloads' : '') + '</title></circle>';
    if (i % every && i !== rows.length - 1) return;
    s += '<text x="' + px(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="10" fill="#6e685f" text-anchor="middle">' + esc(day(r.d)) + '</text>';
  });
  s += '<circle cx="' + px(rows.length - 1).toFixed(1) + '" cy="' + py(last.sessions).toFixed(1) + '" r="4" fill="#55697a" stroke="#fffdfb" stroke-width="2"/>';
  return s + '</svg>';
}
// downloads per day, as white columns inside the band
function columns(rows){
  if (rows.length < 2) return '';
  var W = 560, H = 120, B = 16, gap = 3, peak = Math.max.apply(null, rows.map(function(r){ return r.downloads || 0; }));
  if (!peak) return '<div style="opacity:.7;font-size:13px">No downloads in this period yet.</div>';
  var w = (W - gap * (rows.length - 1)) / rows.length;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Downloads per day">';
  rows.forEach(function(r, i){
    var h = Math.max(2, (H - B - 4) * (r.downloads || 0) / peak), x = i * (w + gap);
    s += '<rect x="' + x.toFixed(1) + '" y="' + (H - B - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="#fff" fill-opacity="' + (r.downloads ? .85 : .18) + '">'
       + '<title>' + esc(day(r.d)) + ': ' + fmt(r.downloads || 0) + ' downloads</title></rect>';
  });
  s += '<text x="0" y="' + (H - 2) + '" font-size="10">' + esc(day(rows[0].d)) + '</text>'
     + '<text x="' + W + '" y="' + (H - 2) + '" font-size="10" text-anchor="end">' + esc(day(rows[rows.length - 1].d)) + '</text>';
  return s + '</svg>';
}
function spark(rows){
  if (rows.length < 2) return '';
  var W = 96, H = 40, peak = Math.max.apply(null, rows.map(function(r){ return r.sessions; })) || 1;
  var pts = rows.map(function(r, i){ return (W * i / (rows.length - 1)).toFixed(1) + ',' + (H - 3 - (H - 6) * r.sessions / peak).toFixed(1); }).join(' ');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="#55697a" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
function ring(n, of, colour){
  var p = of ? Math.min(1, n / of) : 0, r = 26, c = 2 * Math.PI * r;
  return '<svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="' + r + '" fill="none" stroke="#e9e3d8" stroke-width="7"/>'
    + '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="' + colour + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (c * p).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 32 32)"/>'
    + '<text x="32" y="37" text-anchor="middle">' + pct(n, of) + '</text></svg>';
}
function change(rows, key, noun){
  if (rows.length < 14) return '';
  var a = sum(rows.slice(-7), function(r){ return r[key]; }), b = sum(rows.slice(-14, -7), function(r){ return r[key]; });
  if (!b) return '';
  var p = Math.round(100 * (a - b) / b);
  return '<span class="' + (p >= 0 ? 'up' : 'down') + '">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p) + '%</span> ' + (noun || 'this week vs the week before');
}
// the big numbers count up once as they land
function countUp(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-n]').forEach(function(el){
    var to = +el.dataset.n, t0 = performance.now();
    (function tick(t){ var k = Math.min(1, (t - t0) / 700); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); })(t0);
  });
}

function render(d){
  var visits = d.visits || [], pages = {}, paths = {};
  (d.pages || []).forEach(function(p){ pages[p.page] = p.sessions; });
  (d.paths || []).forEach(function(p){ paths[p.path] = p.sessions; });
  // each tab once (paths); the per-day sum counts a tab open across midnight on both days
  var visitors = d.paths ? sum(d.paths, function(p){ return p.sessions; }) : sum(visits, function(r){ return r.sessions; });
  var landing = pages.landing || 0, demo = pages.demo || 0;
  var downloads = what(d, 'cta', 'download'), tried = demo;
  var stayed60 = what(d, 'dwell', '60s'), stayed15 = what(d, 'dwell', '15s'), stayed180 = what(d, 'dwell', '180s'), stayed600 = what(d, 'dwell', '600s');
  var toDemo = what(d, 'cta', 'demo'), toSource = what(d, 'cta', 'source') + what(d, 'cta', 'repo'), toDocs = what(d, 'cta', 'docs');
  var dlChange = change(visits, 'downloads', 'vs the week before');

  var h = '<section class="band"><div><div class="label">Downloads</div><div class="n" data-n="' + downloads + '">' + fmt(downloads) + '</div>'
    + '<div class="hint">pressed Download for Taskuary.exe · <b>' + pct(downloads, landing) + '</b> of site visitors</div>'
    + (dlChange ? '<div class="chip">' + dlChange.replace(/class="(up|down)"/, '') + '</div>' : '') + '</div>'
    + '<div>' + columns(visits) + '</div></section>';

  h += '<div class="kpis">'
    + '<div class="kpi"><div><div class="label">Visitors</div><div class="n" data-n="' + visitors + '">' + fmt(visitors) + '</div><div class="hint">' + (change(visits, 'sessions') || 'tabs that opened the site or the demo') + '</div></div><div class="viz">' + spark(visits) + '</div></div>'
    + '<div class="kpi"><div><div class="label">Tried the demo</div><div class="n" data-n="' + tried + '">' + fmt(tried) + '</div><div class="hint">opened the app in their browser</div></div>' + ring(tried, visitors, '#6f8a6e') + '</div>'
    + '<div class="kpi"><div><div class="label">Stayed a minute or more</div><div class="n" data-n="' + stayed60 + '">' + fmt(stayed60) + '</div><div class="hint">read past the first minute</div></div>' + ring(stayed60, visitors, '#55697a') + '</div>'
    + '</div>';

  // three doors in: the landing page alone, landing then demo, or the demo straight from a link
  var site = paths.site || 0, both = paths.both || 0, straight = paths.demo || 0, all = site + both + straight;
  if (all) {
    var doors = [['Only the site', site, '#55697a'], ['The site, then the demo', both, '#8fa3b1'], ['Straight to the demo', straight, '#6f8a6e']];
    h += '<div class="card doors"><h2>How visitors came in</h2><p class="what"><b>' + fmt(site + both) + '</b> came to the site and <b>' + fmt(straight)
      + '</b> went straight to the demo from a shared link.</p>'
      + '<div class="split">' + doors.map(function(x){ return x[1] ? '<span title="' + esc(x[0]) + ': ' + fmt(x[1]) + '" style="width:' + (100 * x[1] / all).toFixed(2) + '%;background:' + x[2] + '"></span>' : ''; }).join('') + '</div>'
      + '<div class="legend">' + doors.map(function(x){ return '<span><i style="background:' + x[2] + '"></i><b>' + fmt(x[1]) + '</b>' + esc(x[0]) + ' · ' + pct(x[1], all) + '</span>'; }).join('') + '</div></div>';
  }

  h += '<div class="grid"><div class="card"><h2>Visitors per day</h2><p class="what">Each point is one day: everyone who opened taskuary.com or the demo. Hover a day for its count.</p>' + chart(visits) + '</div>'
    + '<div class="card"><h2>What site visitors did next</h2><p class="what">Of the ' + fmt(landing) + ' who opened the landing page. Each is its own choice, so they don\'t add up.</p>'
    + bars([['Read for 15 seconds+', Math.min(stayed15, landing), pct(Math.min(stayed15, landing), landing)],
            ['Clicked Try the demo', toDemo, pct(toDemo, landing)], ['Looked at the source', toSource, pct(toSource, landing)],
            ['Opened the docs', toDocs, pct(toDocs, landing)], ['Downloaded', downloads, pct(downloads, landing), 'end']]
            .filter(function(r, i){ return r[1] || i === 0 || r[3]; }), 'next') + '</div></div>';

  var refs = group(d.refs, function(r){ return source(r.src); }, function(r){ return r.sessions; }).slice(0, 8);
  var countries = (d.countries || []).slice(0, 8).map(function(c){ return [countryName(c.country), c.sessions]; });
  h += '<div class="grid2"><div class="card"><h2>Where visitors come from</h2><p class="what">The site they were on before - "direct" is a typed address, a bookmark or an app that hides it.</p>'
    + (refs.length ? bars(refs.map(function(r){ return [r[0], r[1], fmt(r[1]) + ' · ' + pct(r[1], visitors)]; })) : '<div class="msg">Nobody yet.</div>') + '</div>'
    + '<div class="card"><h2>Countries</h2><p class="what">Where the visit came from, as Cloudflare saw it.</p>'
    + (countries.length ? bars(countries) : '<div class="msg">Nobody yet.</div>') + '</div></div>';

  var tabs = (d.what || []).filter(function(x){ return x.Kind === 'tab'; }).map(function(x){ return [TABS[x.What] || x.What, x.n]; }).slice(0, 8);
  var acts = [['Opened a task', what(d, 'row', 'tasks')], ['Opened a message', what(d, 'row', 'messages')],
              ['Pressed a button in the app', what(d, 'verdict')], ['Typed to the assistant', what(d, 'ask')]].filter(function(r){ return r[1]; });
  h += '<div class="grid2"><div class="card"><h2>Inside the demo</h2><p class="what">What demo visitors did, counted once per press.</p>'
    + (acts.length ? bars(acts) : '<div class="msg">No demo use yet.</div>')
    + (tabs.length ? '<p class="what" style="margin-top:14px">The pages they opened</p>' + bars(tabs) : '') + '</div>'
    + '<div class="card"><h2>How long people stayed</h2><p class="what">Of all visitors, how many were still there after…</p>'
    + bars([['15 seconds', stayed15, pct(stayed15, visitors)], ['1 minute', stayed60, pct(stayed60, visitors)],
            ['3 minutes', stayed180, pct(stayed180, visitors)], ['10 minutes', stayed600, pct(stayed600, visitors)]])
    + '<details><summary>The raw counts</summary><table><tr><th>event</th><th>what</th><th>count</th></tr>'
    + (d.what || []).map(function(x){ return '<tr><td>' + esc(x.Kind) + '</td><td>' + esc(x.What) + '</td><td>' + fmt(x.n) + '</td></tr>'; }).join('')
    + '</table></details></div></div>';
  $('out').innerHTML = h;
  countUp();
}

function load(days){
  $('out').innerHTML = '<div class="msg">Reading…</div>';
  fetch('/api/ev?days=' + days).then(function(r){
    if (!r.ok) throw new Error('Could not read the stats (HTTP ' + r.status + ').');
    return r.json();
  }).then(function(d){
    if (d.note) { $('out').innerHTML = '<div class="msg">' + esc(d.note) + '</div>'; return; }
    render(d);
  }).catch(function(e){ $('out').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
}
document.querySelectorAll('.range button').forEach(function(b){
  b.onclick = function(){ document.querySelectorAll('.range button').forEach(function(x){ x.classList.toggle('on', x === b); }); load(b.dataset.days); };
});
load(30);
</script>
</body></html>
