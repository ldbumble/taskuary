<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Taskuary · site stats</title>
<!-- A DASHBOARD IN PLAIN WORDS (the owner, 2026-10-15: "make it more like a dashboard and easy to understand. I have no idea
     what any of the data means right now"). The numbers are the same anonymous tab sessions /api/ev has always counted
     (functions/api/ev.js); what changed is that each one is named for what it means - visitors, downloads, who tried the
     demo, how long they stayed - instead of the collector's own words (row, verdict, dwell, "5-14 events"). Not linked
     from the site; open to read. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Beacon, the site's own palette (site/index.html) */
  :root{--bg:#f6f4f1;--panel:#fffdfb;--panel2:#e9e3d8;--bd:#e1dcd5;--ink:#262521;--dim:#4d4a43;--faint:#6e685f;
        --accent:#55697a;--accent-ink:#41525f;--sage:#6f8a6e;--sage-ink:#4c6450;--alert:#8a3646;--gold:#d4a72c;
        --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 70px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  header img{width:30px;height:30px;border-radius:8px}
  header h1{font-size:20px;margin:0;letter-spacing:-.01em}
  header .sub{color:var(--faint);font-size:13px}
  .range{margin-left:auto;display:flex;background:var(--panel2);border-radius:99px;padding:3px}
  .range button{font:600 13px var(--sans);border:0;background:transparent;color:var(--dim);padding:6px 14px;border-radius:99px;cursor:pointer}
  .range button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
  .kpi .label{color:var(--dim);font-size:13px;font-weight:600}
  .kpi .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
  .kpi .hint{color:var(--faint);font-size:12.5px;margin-top:2px}
  .kpi.lead{border-color:#cfd8de;background:linear-gradient(180deg,#eef2f4,var(--panel) 70%)}
  .kpi.lead .n{color:var(--accent-ink)}
  .up{color:var(--sage-ink);font-weight:600}.down{color:var(--alert);font-weight:600}
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;min-width:0}
  .card h2{font-size:14px;margin:0 0 2px}
  .card .what{color:var(--faint);font-size:12.5px;margin:0 0 12px}
  svg{display:block;width:100%;height:auto}
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 96px;align-items:center;gap:10px;font-size:13.5px}
  .bar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:99px}
  .bar .val{text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap}
  .funnel .fill{background:var(--sage)}
  .funnel .bar.end .fill{background:var(--accent)}
  .msg{color:var(--faint);padding:30px 0;text-align:center}
  details{margin-top:12px}
  summary{cursor:pointer;color:var(--faint);font-size:13px}
  .foot{color:var(--faint);font-size:12.5px;margin-top:18px;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  td,th{padding:5px 8px;border-top:1px solid var(--bd);text-align:left}td:last-child,th:last-child{text-align:right}
  @media (max-width:820px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid,.grid2{grid-template-columns:1fr} .range{margin-left:0} }
</style>
</head><body><div class="wrap">
<header>
  <img src="/icon.png" alt="">
  <div><h1>taskuary.com</h1><div class="sub">Who came, what they did, and who downloaded</div></div>
  <div class="range" role="tablist" aria-label="Period">
    <button data-days="7">7 days</button><button data-days="30" class="on">30 days</button><button data-days="90">90 days</button>
  </div>
</header>
<div id="out"><div class="msg">Reading…</div></div>
<div class="foot">Every number counts browser tabs, not people: no names, no cookies, no account. A tab that opens the site and then
  the demo is one visitor. Before 15 Oct 2026 the landing page counted each visit twice, so older numbers run high.</div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(n){ return (n || 0).toLocaleString(); }
function pct(a, b){ return b ? Math.round(100 * a / b) + '%' : '–'; }
function sum(rows, f){ return (rows || []).reduce(function(a, r){ return a + (f(r) || 0); }, 0); }
function what(d, kind, name){ return sum((d.what || []).filter(function(x){ return x.Kind === kind && (name == null || x.What === name); }), function(x){ return x.n; }); }

// the collector's words, in the owner's
var TABS = { Board: 'Board', Tasks: 'Tasks', Connections: 'Connections', Hub: 'Hub', Review: 'Review', Reports: 'Reports',
             Assistant: 'Assistant', Settings: 'Settings', Docs: 'Docs', Timeline: 'Timeline' };
function source(src){
  var s = String(src || '').toLowerCase();
  if (!s || s.indexOf('direct') > -1) return 'Direct or bookmark';
  if (/google/.test(s)) return 'Google';
  if (/reddit/.test(s)) return 'Reddit';
  if (/github/.test(s)) return 'GitHub';
  if (/bing|duckduckgo|brave|yahoo|ecosia|kagi/.test(s)) return 'Other search engines';
  if (/t\.co|twitter|x\.com/.test(s)) return 'X (Twitter)';
  if (/linkedin|lnkd/.test(s)) return 'LinkedIn';
  if (/teams|microsoft|outlook|office/.test(s)) return 'Microsoft Teams / Outlook link';
  if (/taskuary\.com/.test(s)) return 'From taskuary.com itself';
  if (/news\.ycombinator|hacker/.test(s)) return 'Hacker News';
  return s.replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/^android-app:\/\//, '');
}
var countryName = (function(){ try { var d = new Intl.DisplayNames(['en'], { type: 'region' }); return function(c){ try { return d.of(c) || c; } catch(e){ return c; } }; } catch(e){ return function(c){ return c; }; } })();

function bars(rows, cls){
  var max = Math.max.apply(null, rows.map(function(r){ return r[1]; }).concat([1]));
  return '<div class="bars ' + (cls || '') + '">' + rows.map(function(r, i){
    return '<div class="bar' + (r[3] ? ' ' + r[3] : '') + '"><span class="name" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span>'
      + '<span class="track"><span class="fill" style="display:block;width:' + Math.max(2, Math.round(100 * r[1] / max)) + '%"></span></span>'
      + '<span class="val">' + esc(r[2] != null ? r[2] : fmt(r[1])) + '</span></div>';
  }).join('') + '</div>';
}
function group(rows, keyOf, valOf){
  var m = {}; (rows || []).forEach(function(r){ var k = keyOf(r); m[k] = (m[k] || 0) + valOf(r); });
  return Object.keys(m).map(function(k){ return [k, m[k]]; }).sort(function(a, b){ return b[1] - a[1]; });
}

// visitors per day: one line, the week-on-week change said beside it
function chart(rows){
  if (rows.length < 2) return '<div class="msg">Not enough days yet.</div>';
  var W = 640, H = 210, L = 34, R = 26, T = 12, B = 24;
  var peak = Math.max.apply(null, rows.map(function(r){ return r.sessions; })) || 1;
  var step = Math.pow(10, Math.floor(Math.log10(peak / 3 || 1)));
  [1, 2, 2.5, 5, 10].some(function(m){ if (step * m * 3 >= peak) { step *= m; return true; } return false; });
  var top = Math.ceil(peak / step) * step;
  var px = function(i){ return L + (W - L - R) * (i / (rows.length - 1)); }, py = function(v){ return H - B - (H - T - B) * (v / top); };
  var pts = rows.map(function(r, i){ return px(i).toFixed(1) + ',' + py(r.sessions).toFixed(1); }).join(' ');
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Visitors per day">';
  for (var t = 0; t <= top; t += step) {
    var y = py(t).toFixed(1);
    s += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#ece7df"/>'
       + '<text x="' + (L - 6) + '" y="' + (+y + 3.5) + '" font-size="10" fill="#6e685f" text-anchor="end" font-family="IBM Plex Mono">' + t + '</text>';
  }
  s += '<polygon points="' + L + ',' + (H - B) + ' ' + pts + ' ' + (W - R) + ',' + (H - B) + '" fill="#55697a" fill-opacity=".10"/>'
     + '<polyline points="' + pts + '" fill="none" stroke="#55697a" stroke-width="2.2" stroke-linejoin="round"/>';
  var every = Math.max(1, Math.ceil(rows.length / 7));
  rows.forEach(function(r, i){
    if (i % every && i !== rows.length - 1) return;
    var d = new Date(r.d + 'T00:00:00');
    s += '<text x="' + px(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="10" fill="#6e685f" text-anchor="middle">'
       + esc(isNaN(d) ? r.d.slice(5) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) + '</text>';
  });
  return s + '</svg>';
}
function change(rows){
  if (rows.length < 14) return '';
  var a = sum(rows.slice(-7), function(r){ return r.sessions; }), b = sum(rows.slice(-14, -7), function(r){ return r.sessions; });
  if (!b) return '';
  var p = Math.round(100 * (a - b) / b);
  return '<span class="' + (p >= 0 ? 'up' : 'down') + '">' + (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p) + '%</span> this week vs the week before';
}

function render(d){
  var visits = d.visits || [], pages = {};
  (d.pages || []).forEach(function(p){ pages[p.page] = p.sessions; });
  var visitors = sum(visits, function(r){ return r.sessions; });
  var landing = pages.landing || 0, demo = pages.demo || 0;
  var downloads = what(d, 'cta', 'download'), tried = demo;
  var stayed60 = what(d, 'dwell', '60s'), stayed15 = what(d, 'dwell', '15s'), stayed180 = what(d, 'dwell', '180s'), stayed600 = what(d, 'dwell', '600s');
  var toDemo = what(d, 'cta', 'demo'), toSource = what(d, 'cta', 'source') + what(d, 'cta', 'repo'), toDocs = what(d, 'cta', 'docs');

  var h = '<div class="kpis">'
    + '<div class="kpi lead"><div class="label">Downloads</div><div class="n">' + fmt(downloads) + '</div><div class="hint">pressed Download for Taskuary.exe · ' + pct(downloads, landing) + ' of site visitors</div></div>'
    + '<div class="kpi"><div class="label">Visitors</div><div class="n">' + fmt(visitors) + '</div><div class="hint">' + (change(visits) || 'browser tabs that opened the site or the demo') + '</div></div>'
    + '<div class="kpi"><div class="label">Tried the demo</div><div class="n">' + fmt(tried) + '</div><div class="hint">opened the app in their browser · ' + pct(tried, visitors) + ' of visitors</div></div>'
    + '<div class="kpi"><div class="label">Stayed a minute or more</div><div class="n">' + fmt(stayed60) + '</div><div class="hint">' + pct(stayed60, visitors) + ' of visitors read past the first minute</div></div>'
    + '</div>';

  h += '<div class="grid"><div class="card"><h2>Visitors per day</h2><p class="what">Each point is one day: everyone who opened taskuary.com or the demo.</p>' + chart(visits) + '</div>'
    + '<div class="card"><h2>From visit to download</h2><p class="what">Of everyone who reached the landing page, how many went further.</p>'
    + bars([['Visited the site', landing, fmt(landing)], ['Read for 15 seconds+', Math.min(stayed15, landing), pct(Math.min(stayed15, landing), landing)],
            ['Clicked Try the demo', toDemo, pct(toDemo, landing)], ['Looked at the source', toSource, pct(toSource, landing)],
            ['Downloaded', downloads, pct(downloads, landing), 'end']], 'funnel') + '</div></div>';

  var refs = group(d.refs, function(r){ return source(r.src); }, function(r){ return r.sessions; }).slice(0, 8);
  var countries = (d.countries || []).slice(0, 8).map(function(c){ return [countryName(c.country), c.sessions]; });
  h += '<div class="grid2"><div class="card"><h2>Where visitors come from</h2><p class="what">The site they were on before - "direct" is a typed address, a bookmark or an app that hides it.</p>'
    + (refs.length ? bars(refs.map(function(r){ return [r[0], r[1], fmt(r[1]) + ' · ' + pct(r[1], visitors)]; })) : '<div class="msg">Nobody yet.</div>') + '</div>'
    + '<div class="card"><h2>Countries</h2><p class="what">Where the visit came from, as Cloudflare saw it.</p>'
    + (countries.length ? bars(countries) : '<div class="msg">Nobody yet.</div>') + '</div></div>';

  var tabs = (d.what || []).filter(function(x){ return x.Kind === 'tab'; }).map(function(x){ return [TABS[x.What] || x.What, x.n]; }).slice(0, 8);
  var acts = [['Opened a task', what(d, 'row', 'tasks')], ['Opened a message', what(d, 'row', 'messages')],
              ['Pressed a button in the app', what(d, 'verdict')], ['Typed to the assistant', what(d, 'ask')]].filter(function(r){ return r[1]; });
  h += '<div class="grid2"><div class="card"><h2>Inside the demo</h2><p class="what">What demo visitors did, counted once per press.</p>'
    + (acts.length ? bars(acts) : '<div class="msg">No demo use yet.</div>')
    + (tabs.length ? '<p class="what" style="margin-top:14px">The pages they opened</p>' + bars(tabs) : '') + '</div>'
    + '<div class="card"><h2>How long people stayed</h2><p class="what">Of all visitors, how many were still there after…</p>'
    + bars([['15 seconds', stayed15, pct(stayed15, visitors)], ['1 minute', stayed60, pct(stayed60, visitors)],
            ['3 minutes', stayed180, pct(stayed180, visitors)], ['10 minutes', stayed600, pct(stayed600, visitors)]])
    + '<details><summary>The raw counts</summary><table><tr><th>event</th><th>what</th><th>count</th></tr>'
    + (d.what || []).map(function(x){ return '<tr><td>' + esc(x.Kind) + '</td><td>' + esc(x.What) + '</td><td>' + fmt(x.n) + '</td></tr>'; }).join('')
    + '</table></details></div></div>';
  $('out').innerHTML = h;
}

function load(days){
  $('out').innerHTML = '<div class="msg">Reading…</div>';
  fetch('/api/ev?days=' + days).then(function(r){
    if (!r.ok) throw new Error('Could not read the stats (HTTP ' + r.status + ').');
    return r.json();
  }).then(function(d){
    if (d.note) { $('out').innerHTML = '<div class="msg">' + esc(d.note) + '</div>'; return; }
    render(d);
  }).catch(function(e){ $('out').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
}
document.querySelectorAll('.range button').forEach(function(b){
  b.onclick = function(){ document.querySelectorAll('.range button').forEach(function(x){ x.classList.toggle('on', x === b); }); load(b.dataset.days); };
});
load(30);
</script>
</body></html>
