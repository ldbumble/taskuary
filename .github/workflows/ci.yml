name: ci
on:
  push: { branches: [master, main] }
  pull_request: { branches: [master, main] }
  workflow_dispatch: # Run required checks on a bot-created chart PR.

# Fork PRs get a read-only token. First-time outside collaborators still need a
# maintainer to click "Approve and run workflows" (repo Actions setting) - the
# trigger is not missing; GitHub holds the run at action_required until then.
permissions: { contents: read }

jobs:
  ci-required:
    name: ci-required
    if: always()
    needs: [test, build-web, browser, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required CI jobs did not pass: {failed}')
          print('All required CI jobs passed')
          PY

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .[dev]
      - run: pip install pyodbc
        if: runner.os == 'Windows'
      - run: pytest -q
      - name: Desk and load CLI
        env:
          TASKUARY_HOME: ${{ runner.temp }}/taskuary-reg
        run: |
          python -m taskuary.testing desk
          python -m taskuary.testing load 32 --force

  build-web:
    # the built UI is committed into taskuary/web; this proves the source still builds,
    # and the node:test suite covers the view logic that has no Python behind it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Verify committed packaged UI matches source
        shell: bash
        run: |
          git diff --exit-code -- taskuary/web
          added=$(git ls-files --others --exclude-standard -- taskuary/web)
          if [ -n "$added" ]; then
            echo "Build produced uncommitted packaged assets:"
            echo "$added"
            exit 1
          fi

  browser:
    # Real Chromium + the disposable fixture backend; never targets the owner's server.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: pip install -e .[dev]
      - run: npm ci
        working-directory: website
      - run: npm run test:browser
        working-directory: website

  docker:
    # proves the image builds, serves the UI, persists across restart, and the
    # token gate still works when TASKUARY_TOKEN is set. The regression desk is
    # seeded into the regression volume first so /api/feed is a real Timeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
      - name: Smoke the container
        run: |
          set -euo pipefail
          docker compose --profile regression run --rm desk
          TASKUARY_TOKEN=regression-secret docker compose --profile regression up -d taskuary-reg
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7787/api/health | grep -q '"ok": *true'; then break; fi
            if [ "$i" -eq 40 ]; then docker compose --profile regression logs; exit 1; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:7787/ | grep -q Taskuary
          js=$(curl -sf http://127.0.0.1:7787/ | sed -n 's/.*src="\/assets\/\([^"]*\)".*/\1/p' | head -1)
          test -n "$js"
          curl -sf "http://127.0.0.1:7787/assets/$js" -o /tmp/taskuary-asset.js
          test -s /tmp/taskuary-asset.js
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request('http://127.0.0.1:7787/api/feed',
                                       headers={'X-Taskuary-Token': 'regression-secret'})
          data = json.load(urllib.request.urlopen(req))['data']
          assert data, 'desk left the Timeline empty'
          assert any(r.get('ReviewStatus') == 'pending' for r in data), 'pending_draft missing from the feed'
          print(len(data), 'feed rows after desk')
          PY
          tid=$(curl -sf -X POST http://127.0.0.1:7787/api/tasks \
            -H 'X-Taskuary-Token: regression-secret' \
            -H 'content-type: application/json' -d '{"Title":"docker smoke"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['taskId'])")
          docker compose --profile regression restart taskuary-reg
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7787/api/health >/dev/null; then break; fi
            if [ "$i" -eq 40 ]; then docker compose --profile regression logs; exit 1; fi
            sleep 1
          done
          curl -sf -H 'X-Taskuary-Token: regression-secret' \
            http://127.0.0.1:7787/api/tasks | grep -q "$tid"
          test "$(docker compose --profile regression exec -T taskuary-reg id -u)" = 1000
          docker compose --profile regression down
          TASKUARY_TOKEN=s3cret docker compose up -d
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7787/api/health >/dev/null; then break; fi
            if [ "$i" -eq 40 ]; then docker compose logs; exit 1; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7787/api/settings)" = 401
          curl -sf -H 'X-Taskuary-Token: s3cret' http://127.0.0.1:7787/api/settings >/dev/null
          docker compose down

  build-exe:
    # push only: a fork PR must not mint the one-file exe (untrusted code + upload)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e .[mssql,desktop,build,bundle]
      - run: pyinstaller taskuary.spec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: Taskuary-windows-exe, path: dist/Taskuary.exe }
